name: Android

# Runs android-test/ (the library's checks) on emulators, from the oldest supported Android
# version (5.0, API 21) to a current one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 21
            target: default
          - api-level: 24
            target: default
          - api-level: 29
            target: default
          - api-level: 35
            target: google_apis
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the tests on Android ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android-test
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.api-level }}-report
          path: android-test/build/reports/androidTests/
